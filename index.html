<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom pattern profiles</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Custom Garment Patterns</h1>
        <p>Custom measurement for custom patterns.</p>
    </header>
    
    <main>
        <section id="profile-creator">
            <h2>Create New Profile</h2>
            <form id="person-form">
                <input type="text" id="person-name" placeholder="Person's Name" required>

                <h3>Measurements (cm)</h3>

                <h4>Vertical Reference:</h4>
                <label>
                    Total height:
                    <span class="tooltip" data-descr="From the floor to the top of the head.">?</span>
                    <input type="number" id="m-total-height" placeholder="">
                </label>
                <label>
                    Nape to Waist
                    <span class="tooltip" data-descr="From the bone at the base of the neck down the spine to the narrowest part of the waist.">?</span>
                    <input type="number" id="m-nape-to-waist" placeholder="">
                </label>
                <label>
                    Waist to Floor:
                    <span class="tooltip" data-descr="From the waist down the side of the leg to the floor.">?</span>
                    <input type="number" id="m-waist-to-floor" placeholder="">
                </label>


                <h4>Upper Body</h4>
                <label>
                    Neck circumference:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-neck-circumference" placeholder="">
                </label>
                <label>
                    High bust:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-high-bust" placeholder="">
                </label>
                <label>
                    Full bust/Chest:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-full-bust" placeholder="">
                </label>
                <label>
                    Underbust:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-underbust" placeholder="">
                </label>
                <label>
                    Natural waist:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-natural-waist" placeholder="">
                </label>
                <label>
                    Shoulder width:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-shoulder-width" placeholder="">
                </label>
                <label>
                    Back width:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-back-width" placeholder="">
                </label>
                <label>
                    Bust span:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-bust-span" placeholder="">
                </label>


                <h4>Lower Body</h4>
                <label>
                    High hip:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-high-hip" placeholder="">
                </label>
                <label>
                    Full hip:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-full-hip" placeholder="">
                </label>
                <label>
                    Waist to Hip:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-waist-to-hip" placeholder="">
                </label>
                <label>
                    Total rise:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-total-rise" placeholder="">
                </label>
                <label>
                    Thigh circumference:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-thigh-circumference" placeholder="">
                </label>
                <label>
                    Knee circumference:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-knee-circumference" placeholder="">
                </label>
                <label>
                    Calf circumference:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-calf-circumference" placeholder="">
                </label>
                <label>
                    Ankle circumference:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-ankle-circumference" placeholder="">
                </label>


                <h4>Arms & Hands</h4>
                <label>
                    Arm length:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-arm-length" placeholder="">
                </label>
                <label>
                    Shoulder to Elbow:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-shoulder-to-elbow" placeholder="">
                </label>
                <label>
                    Upper arm:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-upper-arm" placeholder="">
                </label>
                <label>
                    Wrist circumference:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-wrist-circumference" placeholder="">
                </label>
                <label>
                    Hand circumference:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-hand-circumference" placeholder="">
                </label>


                <h4>Feet & Head</h4>
                <label>
                    Head circumference:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-head-circumference" placeholder="">
                </label>
                <label>
                    Foot length:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-foot-length" placeholder="">
                </label>
                <label>
                    Foot width:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-foot-width" placeholder="">
                </label>
                <label>
                    Instep:
                    <span class="tooltip" data-descr="">?</span>
                    <input type="number" id="m-instep" placeholder="">
                </label>

                <button type="submit">Save Profile</button>
            </form>
        </section>

        <hr>

        <section id="people-list">
            <h2>Saved Profiles</h2>
            <div id="profiles-container">
                <p>No profiles saved yet.</p>
            </div>
        </section>
    </main>
    


    <script src="js/script.js"></script>
</body>
</html>
